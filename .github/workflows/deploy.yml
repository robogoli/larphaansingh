name: Deploy LarphaanSingh to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '6 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify lockfile and install dependencies
        run: |
          test -f package-lock.json
          npm ci --legacy-peer-deps

      - name: Sync daily Krillion questions
        run: node scripts/sync-krillion-daily.mjs

      - name: TypeScript type check
        run: npm run lint

      - name: Build static GitHub Pages bundle
        env:
          VITE_BASE_PATH: /larphaansingh/
        run: npm run build

      - name: Verify production build artifacts
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/manifest.webmanifest
          test -f dist/data/zones.json
          test -f dist/data/quotes.json
          test -f dist/games/krillion/index.html
          test -f dist/games/krillion/daily.json
          test -f dist/assets/gmail-icon.svg
          test -f dist/assets/gmail-32.png
          test -f dist/assets/gmail-180.png
          test -f dist/assets/gmail-192.png
          test -f dist/assets/gmail-512.png
          test -f dist/assets/daknux/logo.png
          grep -q "/larphaansingh/assets/" dist/index.html
          ls -1 dist/assets/*.js >/dev/null

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
