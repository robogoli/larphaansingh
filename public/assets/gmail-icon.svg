<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Gmail">
  <!-- Clean rounded white card backing for high contrast on dark or light tabs -->
  <rect x="2" y="10" width="60" height="44" rx="8" fill="#ffffff" />
  <!-- Left vertical blue bar -->
  <path d="M8 22.5V48a6 6 0 0 0 6 6h4V29.8L8 22.5Z" fill="#4285F4" />
  <!-- Right vertical green bar -->
  <path d="M56 22.5V48a6 6 0 0 1-6 6h-4V29.8l10-7.3Z" fill="#34A853" />
  <!-- Top-right yellow flap -->
  <path d="M46 16v13.8l10-7.3V18a6 6 0 0 0-10-4.4V16Z" fill="#FBBC04" />
  <!-- Center-left/diagonal red M fold -->
  <path d="M18 16v13.8L32 40l14-10.2V16L32 26.5 18 16Z" fill="#EA4335" />
  <!-- Top-left crimson corner flap -->
  <path d="M8 18v4.5l10 7.3V16l-1.9-1.4A5.1 5.1 0 0 0 8 18Z" fill="#C5221F" />
  <!-- Right yellow top-corner refinement -->
  <path d="M56 18a5.1 5.1 0 0 0-8.1-3.4L46 16v13.8l10-7.3V18Z" fill="#FBBC04" />
</svg>
